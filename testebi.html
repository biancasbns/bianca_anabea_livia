
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HATER HOP</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #b8f3e0;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
}

h1 {
    color: #247b60;
    margin-bottom: 12px;
    font-size: 36px;
    text-shadow: 2px 2px white;
}

canvas {
    background: #d8fff0;
    border: 5px solid #247b60;
    border-radius: 12px;
    max-width: 95vw;
}

#info {
    margin-top: 10px;
    color: #185b48;
    font-weight: bold;
    text-align: center;
}
</style>
</head>

<body>

<h1>🐸 HATER HOP 🐸</h1>

<canvas id="game" width="800" height="500"></canvas>

<div id="info">
    Use A e D ou as setas para andar. Espaço para pular!
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let estado = "menu";
let pontos = 0;
let teclas = {};

let jogador;
let plataformas;
let estrelas;
let inimigos;

function iniciarJogo() {
    pontos = 0;
    jogador = {
        x: 100,
        y: 380,
        r: 25,
        vx: 0,
        vy: 0,
        velocidade: 5,
        pulando: false
    };

    plataformas = [
        {x: 0, y: 460, w: 800, h: 40},
        {x: 120, y: 370, w: 130, h: 15},
        {x: 330, y: 300, w: 130, h: 15},
        {x: 550, y: 230, w: 130, h: 15},
        {x: 300, y: 160, w: 130, h: 15},
        {x: 80, y: 90, w: 130, h: 15}
    ];

    estrelas = [
        {x: 185, y: 330, pega: false},
        {x: 395, y: 260, pega: false},
        {x: 615, y: 190, pega: false},
        {x: 365, y: 120, pega: false},
        {x: 145, y: 50, pega: false}
    ];

    inimigos = [
        {x: 300, y: 430, vx: 2, min: 270, max: 500},
        {x: 570, y: 200, vx: 2, min: 550, max: 680}
    ];

    estado = "jogando";
}

function desenharFundo() {
    let gradiente = ctx.createLinearGradient(0, 0, 0, 500);
    gradiente.addColorStop(0, "#b3edff");
    gradiente.addColorStop(1, "#d5ffe4");

    ctx.fillStyle = gradiente;
    ctx.fillRect(0, 0, 800, 500);

    ctx.fillStyle = "rgba(255,255,255,0.7)";

    ctx.beginPath();
    ctx.arc(100, 65, 25, 0, Math.PI * 2);
    ctx.arc(130, 65, 30, 0, Math.PI * 2);
    ctx.arc(160, 65, 22, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(620, 110, 22, 0, Math.PI * 2);
    ctx.arc(650, 110, 30, 0, Math.PI * 2);
    ctx.arc(680, 110, 22, 0, Math.PI * 2);
    ctx.fill();
}

function desenharJogador() {
    ctx.save();

    ctx.translate(jogador.x, jogador.y);

    let corpo = ctx.createRadialGradient(
        -8, -12, 3, 0, 0, 32
    );

    corpo.addColorStop(0, "#d6ff52");
    corpo.addColorStop(0.45, "#50e58b");
    corpo.addColorStop(1, "#079b70");

    ctx.fillStyle = corpo;
    ctx.beginPath();
    ctx.ellipse(0, 0, 28, 25, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#a9ffcb";
    ctx.beginPath();
    ctx.ellipse(0, 12, 17, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#078b65";
    ctx.beginPath();
    ctx.arc(-16, -17, 10, 0, Math.PI * 2);
    ctx.arc(13, -18, 10, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(-16, -20, 7, 0, Math.PI * 2);
    ctx.arc(13, -21, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#243c55";
    ctx.beginPath();
    ctx.arc(-14, -19, 3, 0, Math.PI * 2);
    ctx.arc(15, -20, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(16, -22, 2, 0, Math.PI * 2);
    ctx.arc(-13, -20, 1.5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#e76d9a";
    ctx.beginPath();
    ctx.arc(-22, 3, 5, 0, Math.PI * 2);
    ctx.arc(22, 3, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#145c45";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, 4, 8, 0.2, Math.PI - 0.2);
    ctx.stroke();

    ctx.restore();
}

function desenharPlataformas() {
    plataformas.forEach(p => {
        ctx.fillStyle = "#42bd79";
        ctx.fillRect(p.x, p.y, p.w, p.h);

        ctx.fillStyle = "#a5f46c";
        ctx.fillRect(p.x, p.y, p.w, 5);

        ctx.fillStyle = "#268b61";
        ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);
    });
}

function desenharEstrela(x, y) {
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = "#ffcc33";
    ctx.strokeStyle = "#f39c12";
    ctx.lineWidth = 2;

    ctx.beginPath();

    for (let i = 0; i < 10; i++) {
        let raio = i % 2 === 0 ? 12 : 5;
        let angulo = -Math.PI / 2 + i * Math.PI / 5;

        let px = Math.cos(angulo) * raio;
        let py = Math.sin(angulo) * raio;

        if (i === 0) {
            ctx.moveTo(px, py);
        } else {
            ctx.lineTo(px, py);
        }
    }

    ctx.closePath();
    ctx.fill();
    ctx.stroke();
    ctx.restore();
}

function desenharInimigo(e) {
    ctx.fillStyle = "#ff5278";
    ctx.beginPath();
    ctx.arc(e.x, e.y, 19, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(e.x - 7, e.y - 4, 5, 0, Math.PI * 2);
    ctx.arc(e.x + 7, e.y - 4, 5, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#252525";
    ctx.beginPath();
    ctx.arc(e.x - 7, e.y - 4, 2, 0, Math.PI * 2);
    ctx.arc(e.x + 7, e.y - 4, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = "#9e2447";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(e.x - 7, e.y + 7);
    ctx.lineTo(e.x + 7, e.y + 7);
    ctx.stroke();
}

function atualizar() {
    if (estado !== "jogando") return;

    jogador.vx = 0;

    if (teclas["ArrowLeft"] || teclas["a"] || teclas["A"]) {
        jogador.vx = -jogador.velocidade;
    }

    if (teclas["ArrowRight"] || teclas["d"] || teclas["D"]) {
        jogador.vx = jogador.velocidade;
    }

    jogador.x += jogador.vx;

    if (jogador.x < jogador.r) jogador.x = jogador.r;
    if (jogador.x > 800 - jogador.r) jogador.x = 800 - jogador.r;

    jogador.vy += 0.5;
    jogador.y += jogador.vy;

    jogador.pulando = true;

    plataformas.forEach(p => {
        if (
            jogador.vy > 0 &&
            jogador.x + jogador.r > p.x &&
            jogador.x - jogador.r < p.x + p.w &&
            jogador.y + jogador.r >= p.y &&
            jogador.y + jogador.r - jogador.vy <= p.y
        ) {
            jogador.y = p.y - jogador.r;
            jogador.vy = 0;
            jogador.pulando = false;
        }
    });

    inimigos.forEach(e => {
        e.x += e.vx;

        if (e.x < e.min || e.x > e.max) {
            e.vx *= -1;
        }

        let dx = jogador.x - e.x;
        let dy = jogador.y - e.y;
        let distancia = Math.sqrt(dx * dx + dy * dy);

        if (distancia < jogador.r + 17) {
            estado = "gameover";
        }
    });

    estrelas.forEach(s => {
        if (!s.pega) {
            let dx = jogador.x - s.x;
            let dy = jogador.y - s.y;

            if (Math.sqrt(dx * dx + dy * dy) < 35) {
                s.pega = true;
                pontos++;
            }
        }
    });

    if (pontos >= 5) {
        estado = "vitoria";
    }

    if (jogador.y > 530) {
        estado = "gameover";
    }
}

function desenharJogo() {
    desenharFundo();
    desenharPlataformas();

    estrelas.forEach(s => {
        if (!s.pega) desenharEstrela(s.x, s.y);
    });

    inimigos.forEach(desenharInimigo);

    desenharJogador();

    ctx.fillStyle = "#185b48";
    ctx.font = "bold 23px Arial";
    ctx.fillText("⭐ " + pontos + " / 5", 20, 35);
}

function desenharBotao(texto, x, y, w, h) {
    ctx.fillStyle = "#238b65";
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 15);
    ctx.fill();

    ctx.fillStyle = "white";
    ctx.font = "bold 23px Arial";
    ctx.textAlign = "center";
    ctx.fillText(texto, x + w / 2, y + 35);
    ctx.textAlign = "left";
}

function desenharMenu() {
    desenharFundo();

    ctx.fillStyle = "#247b60";
    ctx.textAlign = "center";
    ctx.font = "bold 55px Arial";
    ctx.fillText("HATER HOP", 400, 150);

    ctx.font = "25px Arial";
    ctx.fillText("🐸 O sapinho está pronto para pular!", 400, 210);

    ctx.font = "19px Arial";
    ctx.fillText("Colete as 5 estrelas e fuja dos haters!", 400, 255);

    desenharBotao("JOGAR", 300, 320, 200, 55);

    ctx.textAlign = "left";
}

function desenharFim(titulo, mensagem) {
    desenharFundo();

    ctx.fillStyle = "#247b60";
    ctx.textAlign = "center";
    ctx.font = "bold 48px Arial";
    ctx.fillText(titulo, 400, 170);

    ctx.font = "23px Arial";
    ctx.fillText(mensagem, 400, 235);

    ctx.font = "21px Arial";
    ctx.fillText("Estrelas: " + pontos + " / 5", 400, 275);

    desenharBotao("JOGAR NOVAMENTE", 260, 330, 280, 55);

    ctx.textAlign = "left";
}

function desenhar() {
    if (estado === "menu") {
        desenharMenu();
    }

    if (estado === "jogando") {
        desenharJogo();
    }

    if (estado === "gameover") {
        desenharFim("GAME OVER!", "Os haters pegaram o sapinho!");
    }

    if (estado === "vitoria") {
        desenharFim("VOCÊ VENCEU!", "Parabéns! Você salvou o sapinho!");
    }
}

function loop() {
    atualizar();
    desenhar();
    requestAnimationFrame(loop);
}

document.addEventListener("keydown", function(e) {
    teclas[e.key] = true;

    if (["ArrowLeft", "ArrowRight", "ArrowUp", " "].includes(e.key)) {
        e.preventDefault();
    }

    if (
        (e.code === "Space" || e.key === "ArrowUp" ||
        e.key === "w" || e.key === "W") &&
        estado === "jogando" &&
        !jogador.pulando
    ) {
        jogador.vy = -12;
        jogador.pulando = true;
    }
});

document.addEventListener("keyup", function(e) {
    teclas[e.key] = false;
});

canvas.addEventListener("click", function(e) {
    const rect = canvas.getBoundingClientRect();

    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);

    if (
        (estado === "menu" && x >= 300 && x <= 500 &&
        y >= 320 && y <= 375) ||
        ((estado === "gameover" || estado === "vitoria") &&
        x >= 260 && x <= 540 && y >= 330 && y <= 385)
    ) {
        iniciarJogo();
    }
});

loop();
</script>

</body>
</html>
